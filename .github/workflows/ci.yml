name: CI

on:
  pull_request:
  push:
    branches: [main]

  # Weekly schedule: re-runs this same CI (incl. the dependency audit in the
  # `frontend` job) on a cadence so newly-published advisories against pinned
  # versions are caught even without a new push. Cron minute is offset from
  # other fleet repos to avoid a same-minute stampede (00=origin/fleet-tooling,
  # 05=clear, 10=deal, 15=field, 20=payout, 30=nene2-python, 40=records-commercial).
  #
  # KNOWN LIMITATION: GitHub auto-disables scheduled workflows after 60 days
  # of repository inactivity. A dormant repo — the one most in need of this
  # check — is exactly the one where it silently stops firing. There is no
  # in-repo fix for this; it needs an external poller (fleet-level, tracked
  # outside this repo) to detect a stale last-run date.
  schedule:
    - cron: '20 0 * * 1' # Monday 00:20 UTC = 09:20 JST

  # Manual trigger, with an optional switch to rehearse the failure path
  # (see the "Simulate failure" step in the `frontend` job and the
  # `notify-failure` job below) without waiting for the next scheduled run.
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Intentionally fail the frontend job to verify the failure-notification path'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # github.event_name is included so a schedule/workflow_dispatch run is not
  # cancelled by a push run racing it on the same ref (observed in the fleet
  # rollout: without it, dispatch/schedule runs get silently cancelled by push).
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (composer check)
    runs-on: ubuntu-latest
    steps:
      # NENE2 is consumed via a Composer path repository (`../NENE2`), so it must
      # sit as a sibling of this repo on the runner. Both repos are public.
      - name: Checkout nene-payout
        uses: actions/checkout@v7
        with:
          path: nene-payout

      - name: Checkout NENE2 (path dependency)
        uses: actions/checkout@v7
        with:
          repository: hideyukiMORI/NENE2
          ref: main
          path: NENE2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, dom, xml, curl, pdo, pdo_mysql, bcmath
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: nene-payout/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('nene-payout/composer.json') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        working-directory: nene-payout
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run checks
        working-directory: nene-payout
        run: composer check

  frontend:
    name: Frontend (npm run check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Simulate failure (validation only)
        if: inputs.simulate_failure
        run: exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      # `check` verifies types, lint, format, tests and styles, but never bundles anything —
      # so a failure that only shows up in the Vite build (module/asset resolution, the widget
      # IIFE lib build) used to reach main with a green gate. The widget bundle in particular
      # ships to third-party pages. Kept in CI rather than in `check` so the local `check`
      # stays fast. Fleet context: the cross-repo "check が本番 build を走らせない" sweep (#265).
      - name: Build (app bundle + embeddable widget)
        run: npm run build

      # @smoke runs inside this required job on purpose (#263). payout's whole e2e suite is
      # the one hermetic smoke spec, so a separate `e2e` job would only make a one-spec job
      # required and cost a second `npm ci`. The fleet target form is a dedicated e2e job
      # (invoice #733/#735); split this out when B-4 (nene2-e2e) grows the suite.
      # No continue-on-error: a red smoke must fail this job, or "required" means nothing.
      - name: Install Playwright browser (chromium)
        run: npx playwright install --with-deps chromium

      # Hermetic: page.route() stubs the API, and playwright.config.ts starts the Vite dev
      # server itself — no backend, DB or Docker, and it never touches a deployed host.
      - name: Run @smoke (boot → sign in → dashboard shell)
        run: npm run e2e:smoke

      # audit-ci = npm audit + a per-advisory allowlist, so a not-yet-fixable advisory can be
      # excepted with a written, expiring reason instead of blunting the whole gate. Anything
      # high/critical that is not listed in frontend/audit-ci.jsonc still fails.
      # Policy: docs/development/dependency-audit.md
      - name: Audit (fail on high/critical)
        run: npm run audit

  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-failure:
    name: Open an issue when the scheduled run fails
    if: failure() && (github.event_name == 'schedule' || inputs.simulate_failure)
    needs: [backend, frontend, secret-scan]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      ISSUE_TITLE: '🔴 payout: 週次 CI（schedule）が失敗しています'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Create or update the failure issue
        run: |
          set -euo pipefail
          existing="$(gh issue list --state open --limit 100 --json number,title \
            | jq -r --arg t "$ISSUE_TITLE" 'map(select(.title == $t)) | .[0].number // empty')"
          body="週次の schedule 実行が失敗しました。 実行: ${RUN_URL}"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$ISSUE_TITLE" --body "$body"
          fi
